# Freight Lane Workshop — Complete Docker Compose
#
# Contains: Kafka cluster + Banking-system application components.
#

x-kafka-env: &kafka-common-env
  PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker-1:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  CLUSTER_ID: freight-lane-workshop-cluster-001
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_LOG_RETENTION_HOURS: 6

x-banking-app: &banking-app
  image: freight-lane-banking-system:latest
  build: ./banking-system
  depends_on:
    broker-1:
      condition: service_healthy
  restart: unless-stopped

x-banking-env: &banking-common-env
  KAFKA_BOOTSTRAP_SERVERS: broker-1:29091

services:

  # ─────────────────────────────────────────────────
  # KAFKA CLUSTER
  # ─────────────────────────────────────────────────

  broker-1:
    image: apache/kafka:4.0.0
    container_name: broker-1
    hostname: broker-1
    ports:
      - "9091:9091"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://broker-1:29091,CONTROLLER://broker-1:9093,EXTERNAL://0.0.0.0:9091
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:29091,EXTERNAL://localhost:9091
    volumes:
      - broker-1-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server broker-1:29091 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  broker-2:
    image: apache/kafka:4.0.0
    container_name: broker-2
    hostname: broker-2
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://broker-2:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:29092,EXTERNAL://localhost:9092
    volumes:
      - broker-2-data:/var/lib/kafka/data
    depends_on:
      broker-1:
        condition: service_healthy
    profiles:
      - scale

  # ─────────────────────────────────────────────────
  # BANKING SYSTEM APPLICATION COMPONENTS
  # ─────────────────────────────────────────────────

  atm:
    <<: *banking-app
    container_name: atm
    command: [ "atm" ]
    environment:
      <<: *banking-common-env
      ATM_ID: ATM-LISBON-042

  fraud-detection:
    <<: *banking-app
    container_name: fraud-detection
    command: [ "fraud-detection" ]
    environment:
      <<: *banking-common-env
      FRAUD_RISK_THRESHOLD: "0.70"

  account-balance:
    <<: *banking-app
    container_name: account-balance
    command: [ "account-balance" ]
    environment:
      <<: *banking-common-env

  ledger:
    <<: *banking-app
    container_name: ledger
    command: [ "ledger" ]
    environment:
      <<: *banking-common-env

  analytics:
    <<: *banking-app
    container_name: analytics
    command: [ "analytics" ]
    environment:
      <<: *banking-common-env

  notifications:
    <<: *banking-app
    container_name: notifications
    command: [ "notifications" ]
    environment:
      <<: *banking-common-env

volumes:
  broker-1-data:
  broker-2-data:
